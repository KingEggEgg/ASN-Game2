<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ASN Rush Live Leaderboard</title>
  <link rel="stylesheet" href="leaderboard.css?v=30">
  <style>
    html,body{min-height:100%;margin:0}
    body{background:radial-gradient(circle at top,#164a83 0,#071827 55%,#020912 100%);color:#fff;font-family:Arial,Helvetica,sans-serif}
    .display-shell{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .display-board{width:min(1180px,97vw);border:5px solid #111;border-radius:24px;background:rgba(5,22,38,.96);box-shadow:14px 14px 0 rgba(0,0,0,.35);overflow:hidden}
    .display-head{padding:22px 30px;background:linear-gradient(90deg,#ffd02a,#ffb300);color:#111;text-align:center;border-bottom:5px solid #111}
    .display-head .eyebrow{font-size:18px;font-weight:1000;letter-spacing:.14em}
    .display-head h1{font-size:clamp(46px,6vw,84px);line-height:.9;margin:8px 0 6px;text-transform:uppercase}
    .display-head p{font-weight:900;margin:0;font-size:22px}
    .record-card{display:flex;align-items:center;justify-content:center;gap:28px;padding:18px;border-bottom:3px solid rgba(255,255,255,.12)}
    .record-card span{font-weight:900;text-transform:uppercase;letter-spacing:.1em;opacity:.8}
    .record-card strong{font-size:clamp(44px,6vw,76px);color:#ffd02a}
    .display-status{text-align:center;padding:8px;font-weight:900}
    .display-table-wrap{max-height:58vh;overflow-y:auto}
    .display-table{width:100%;border-collapse:collapse}
    .display-table th,.display-table td{padding:12px 24px;border-bottom:1px solid rgba(255,255,255,.1);font-size:clamp(18px,1.8vw,28px)}
    .display-table th{position:sticky;top:0;background:#071827;z-index:2;font-size:14px;text-transform:uppercase;letter-spacing:.12em;opacity:.92;text-align:left}
    .display-table td:first-child{width:100px;font-weight:1000;color:#ffd02a}
    .display-table td:last-child{font-weight:1000}
    .display-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;font-size:16px;font-weight:900;letter-spacing:.06em}
    .admin-btn{border:2px solid #ffd02a;color:#ffd02a;background:transparent;border-radius:999px;padding:9px 14px;font-weight:900;cursor:pointer}
    .admin-panel{display:none;padding:16px 20px;border-top:2px solid rgba(255,255,255,.12);background:#06111e}
    .admin-panel.show{display:block}
    .admin-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}
    .admin-grid input{padding:11px 12px;border-radius:8px;border:1px solid #334b60;background:#0d2236;color:#fff}
    .admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .danger{background:#e53935;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:900;cursor:pointer}
    .secondary{background:#20384f;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:900;cursor:pointer}
    .admin-message{margin-top:10px;font-weight:800}
    @media(max-width:700px){
      .display-shell{padding:8px}
      .admin-grid{grid-template-columns:1fr}
      .display-table th,.display-table td{padding:10px 12px}
      .display-footer{flex-direction:column}
    }
  </style>
</head>
<body>
  <main class="display-shell">
    <section class="display-board">
      <header class="display-head">
        <div class="eyebrow">🏆 COMMERCIAL DAY</div>
        <h1>ASN RUSH</h1>
        <p>LIVE LEADERBOARD · TOP 50</p>
      </header>
      <div class="record-card">
        <span>Best Time</span>
        <strong id="bestTime">--:--</strong>
      </div>
      <div class="display-status" id="displayStatus">Connecting...</div>
      <div class="display-table-wrap">
        <table class="display-table">
          <thead><tr><th>Rank</th><th>Player</th><th>Time</th></tr></thead>
          <tbody id="displayRows"><tr><td colspan="3" style="text-align:center;opacity:.65">Loading scores...</td></tr></tbody>
        </table>
      </div>
      <div class="display-footer">
        <span>CAN YOU BEAT THE RECORD?</span>
        <span id="lastRefresh">Refresh: --:--:--</span>
        <button class="admin-btn" id="adminToggle">ADMIN</button>
      </div>
      <section class="admin-panel" id="adminPanel">
        <div id="adminLoggedOut">
          <div class="admin-grid">
            <input id="adminEmail" type="email" placeholder="Admin email">
            <input id="adminPassword" type="password" placeholder="Password">
            <button class="secondary" id="adminLogin">Login</button>
          </div>
        </div>
        <div id="adminLoggedIn" hidden>
          <strong>Admin signed in: <span id="adminUser"></span></strong>
          <div class="admin-actions">
            <button class="danger" id="resetScores">Reset All Scores</button>
            <button class="secondary" id="adminLogout">Log Out</button>
          </div>
        </div>
        <div class="admin-message" id="adminMessage"></div>
      </section>
    </section>
  </main>
  <script type="module" src="leaderboard-display.js?v=30"></script>
</body>
</html>
